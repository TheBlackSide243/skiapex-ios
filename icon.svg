<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Apex: a snowy peak at night with a glacier-blue ski track winding down from the top. iOS rounds the corners itself. -->
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#1D3A5F"/>
      <stop offset="0.55" stop-color="#0E1D33"/>
      <stop offset="1" stop-color="#08111E"/>
    </radialGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A6EA5"/>
      <stop offset="1" stop-color="#16304F"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22436B"/>
      <stop offset="1" stop-color="#0F2038"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="770" cy="230" r="9" fill="#F2F6FB" opacity="0.8"/>
  <circle cx="250" cy="300" r="6" fill="#F2F6FB" opacity="0.55"/>
  <circle cx="860" cy="390" r="5" fill="#F2F6FB" opacity="0.45"/>
  <!-- The mountain behind. -->
  <path d="M 40 900 L 300 520 L 420 640 L 520 560 L 1024 900 L 1024 1024 L 0 1024 Z" fill="url(#back)"/>
  <!-- The peak. -->
  <path d="M 120 1024 L 512 230 L 920 1024 Z" fill="url(#peak)"/>
  <!-- Its snow cap, with a ragged edge. -->
  <path d="M 512 230 L 640 488 L 596 456 L 560 508 L 516 462 L 470 520 L 436 470 L 392 498 Z" fill="#EAF6FF"/>
  <path d="M 512 230 L 640 488 L 596 456 L 560 508 Z" fill="#C9E3F7"/>
  <!-- The ski track: from the top, turning down to the bottom. -->
  <path d="M 512 262 C 600 380 420 470 520 590 C 610 700 380 770 470 900 C 500 945 540 980 560 1024"
        fill="none" stroke="#5CCFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="262" r="30" fill="#5CCFFF"/>
  <circle cx="512" cy="262" r="13" fill="#0B1626"/>
</svg>
