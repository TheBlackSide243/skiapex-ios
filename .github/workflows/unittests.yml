# Unit tests: the runs and lifts found in made-up days, the days on disk, the GPX. On every push
# and by hand.
name: Unit tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittests:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi 'beta' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen

      - name: Xcode project
        run: xcodegen generate

      - name: Unit tests
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E "^\s+iPhone" | grep -v -i duo | tail -1 | sed -E 's/^ +(.*) \([0-9A-F-]+\).*/\1/')
          echo "Simulator: $SIM"
          xcodebuild test -project Carve.xcodeproj -scheme Carve -only-testing:CarveTests \
            -destination "platform=iOS Simulator,name=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee test.log | grep -E "Test Case|error:|XCTAssert|TEST (SUCCEEDED|FAILED)|\*\* "

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-log
          path: test.log
          retention-days: 7
