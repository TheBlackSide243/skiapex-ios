# Unsigned .ipa for Feather/Sideloadly/AltStore, built on a GitHub macOS runner. The .app gets an
# ad-hoc signature only; the sideloading tool re-signs it with your Apple ID.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi 'beta' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen librsvg

      - name: App icon
        run: rsvg-convert -w 1024 -h 1024 -b '#08111E' icon.svg -o Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Xcode project
        run: xcodegen generate

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild -project Apex.xcodeproj -scheme Apex -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/Apex.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|ARCHIVE" || true
          test -d build/Apex.xcarchive/Products/Applications/Apex.app || { grep -E "error" build.log | head -80; exit 1; }

      - name: Package the .ipa
        run: |
          set -eu
          rm -rf Payload && mkdir Payload
          cp -R build/Apex.xcarchive/Products/Applications/Apex.app Payload/
          for x in Payload/Apex.app/PlugIns/*.appex; do if [ -d "$x" ]; then codesign -f -s - "$x"; fi; done
          codesign -f -s - Payload/Apex.app
          VER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/Apex.app/Info.plist)"
          zip -qry "Apex-$VER-unsigned.ipa" Payload
          ls -la ./*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: apex-ipa
          path: Apex-*-unsigned.ipa
          retention-days: 14

      # The icon as drawn for the app, for the Feather source.
      - uses: actions/upload-artifact@v4
        with:
          name: icon
          path: Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7
