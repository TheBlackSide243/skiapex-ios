# Unsigned .ipa for Feather/Sideloadly/AltStore, built on a GitHub macOS runner. The .app gets an
# ad-hoc signature only; the sideloading tool re-signs it with your Apple ID.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi 'beta' | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Tools
        run: brew install xcodegen librsvg

      # The icon of the app and the ones to choose from in Settings, without an alpha channel.
      - name: App icons
        run: python3 scripts/icons.py

      - name: Xcode project
        run: xcodegen generate

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild -project SkiApex.xcodeproj -scheme SkiApex -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/SkiApex.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD|ARCHIVE" || true
          test -d build/SkiApex.xcarchive/Products/Applications/SkiApex.app || { grep -E "error" build.log | head -80; exit 1; }

      - name: Package the .ipa
        run: |
          set -eu
          rm -rf Payload && mkdir Payload
          cp -R build/SkiApex.xcarchive/Products/Applications/SkiApex.app Payload/
          # The Apple Watch app stays out: sideloading tools sign the iPhone app only, and an
          # unsigned watch app inside makes the installation fail. It comes with TestFlight.
          if [ -d Payload/SkiApex.app/Watch ]; then ls Payload/SkiApex.app/Watch Payload/SkiApex.app/Watch/SkiApexWatch.app/PlugIns || echo "::warning::No complication inside the Apple Watch app"; rm -rf Payload/SkiApex.app/Watch; else echo "::warning::No Apple Watch app inside the archive"; fi
          for x in Payload/SkiApex.app/PlugIns/*.appex; do if [ -d "$x" ]; then codesign -f -s - "$x"; fi; done
          codesign -f -s - Payload/SkiApex.app
          VER="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Payload/SkiApex.app/Info.plist)"
          zip -qry "SkiApex-$VER-unsigned.ipa" Payload
          ls -la ./*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: skiapex-ipa
          path: SkiApex-*-unsigned.ipa
          retention-days: 14

      # The icon as drawn for the app, for the Feather source.
      - uses: actions/upload-artifact@v4
        with:
          name: icon
          path: Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
          retention-days: 7
