name: SkiApex
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    APP_ID: com.local.skiapex
targets:
  SkiApex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - target: SkiApexLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        PRODUCT_NAME: SkiApex
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - SkiApexTests
  # The day under way on the lock screen and in the Dynamic Island.
  SkiApexLive:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).live
        PRODUCT_NAME: SkiApexLive
        INFOPLIST_FILE: LiveWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  SkiApexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: SkiApex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.skiapex.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkiApex.app/SkiApex"
        BUNDLE_LOADER: "$(TEST_HOST)"
