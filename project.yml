name: SkiApex
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "16"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    APP_ID: com.local.skiapex
    # The app's OAuth client ID at Google (type iOS), for "Continue with Google"; empty: no button.
    GOOGLE_CLIENT_ID: ""
targets:
  SkiApex:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - target: SkiApexLive
      # The Apple Watch app travels inside the iPhone app, in its Watch folder.
      - target: SkiApexWatch
        embed: true
        codeSign: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        PRODUCT_NAME: SkiApex
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icons to choose from in Settings, drawn by scripts/icons.py.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Aurora AppIcon-Alba AppIcon-Bosco AppIcon-Carbone AppIcon-Neve AppIcon-Classica AppIcon-Specchio AppIcon-SullaNeve"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - SkiApexTests
  # The day under way on the lock screen and in the Dynamic Island.
  SkiApexLive:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).live
        PRODUCT_NAME: SkiApexLive
        INFOPLIST_FILE: LiveWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  # The day under way on the wrist: the numbers from the iPhone, and its buttons.
  SkiApexWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch
      - path: Shared/WatchLink.swift
      - path: Shared/UnitText.swift
      # What cuts a day into runs and lifts: the watch counts them by itself.
      - path: Sources/Model/Track.swift
      - path: Sources/Model/Segmenter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).watchkitapp
        PRODUCT_NAME: SkiApexWatch
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - target: SkiApexWatchFace
  # Ski Apex on the face of the watch: a complication that opens the app.
  SkiApexWatchFace:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchFace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).watchkitapp.face
        PRODUCT_NAME: SkiApexWatchFace
        INFOPLIST_FILE: WatchFace/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  SkiApexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnitTests
    dependencies:
      - target: SkiApex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.skiapex.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkiApex.app/SkiApex"
        BUNDLE_LOADER: "$(TEST_HOST)"
